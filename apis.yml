aid: world50
name: World 50 Group
description: >-
  World 50 Group is an invitation-only membership community for CEOs, board
  directors, and C-suite executives from the world's largest and most
  respected companies. It runs highly curated peer communities organized by
  role (General Counsel 50, Procurement 50, Human Resource 50, President 50,
  Innovating 50, and more), the NEXT executive-development platform (Next
  Director, Next Leader, Next Generation Leadership), and publishes C-suite
  insights and impact research. Membership is by invitation; members access
  the community through the World 50 iOS/Android app. The company publishes
  no public developer program or API surface.
